<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harbor</title>
  <link rel="stylesheet" href="full.css">
</head>
<body>

  <div class="app-container">
    
    <!-- LEFT SIDEBAR: Local AI Chat interface -->
    <aside class="sidebar" id="chat-sidebar">
      <!-- Sidebar Header -->
      <div class="sidebar-header">
        <div class="sidebar-status-row">
          <div class="ai-branding">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--teal);">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <span>Wave AI Co-Pilot</span>
          </div>
          <div class="sidebar-header-actions">
            <div class="ai-status-indicator">
              <span id="dot-ai-status" class="status-dot inactive"></span>
              <span id="lbl-ai-status">Ollama Offline</span>
            </div>
            <button id="btn-toggle-sidebar" class="btn-ghost-icon" title="Toggle Sidebar">
              <svg id="icon-toggle-sidebar" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
            </button>
          </div>
        </div>

        <!-- Conversation controls row -->
        <div class="chat-controls-row">
          <button id="btn-new-chat" class="btn-new-chat" title="Start New Chat">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>New Chat</span>
          </button>
          <button id="btn-history" class="btn-history" title="Conversation History">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
          </button>
        </div>

        <!-- Model dropdown and Pull model action -->
        <div class="model-selector-container">
          <select id="select-model" class="select-model" title="Select Local LLM Model">
            <option value="">No Models Available</option>
          </select>
          <button id="btn-pull-model" class="btn-pull" title="Pull a new model (llama3, mistral, phi3)">Pull</button>
        </div>
      </div>

      <!-- History Panel Overlay -->
      <div id="history-panel" class="history-panel hidden">
        <div class="history-panel-header">
          <span>Conversation History</span>
        </div>
        <div id="history-list" class="history-list">
          <!-- History items added dynamically -->
        </div>
        <div class="history-panel-footer">
          <button id="btn-show-archived" class="btn-text-toggle">Show Archived</button>
        </div>
      </div>

      <!-- Scrollable Message list -->
      <div id="chat-messages" class="chat-messages">
        <!-- Default Welcome message -->
        <div class="message assistant">
          <span class="message-label">Wave AI Co-Pilot</span>
          <div class="message-bubble">
            Hello! I am your Wave OS Local AI Assistant. I run fully offline on your GPU. 
            Select a model above to begin chatting! If you don't have Llama 3 yet, click the <strong>Pull</strong> button to download it.
          </div>
        </div>
      </div>

      <!-- Chat Bottom Input bar -->
      <div class="chat-input-container">
        <textarea id="chat-input" class="chat-textarea" placeholder="Type a message... (Ctrl+Enter to send)" rows="1"></textarea>
        <button id="btn-send" class="btn-send" title="Send message" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </aside>

    <!-- RIGHT PANEL: Address bar. BrowserView loads underneath -->
    <main class="right-panel" id="webview-container">
      <!-- Floating sidebar trigger button when collapsed -->
      <button id="btn-show-sidebar" class="btn-show-sidebar" title="Expand Sidebar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>

      <!-- Top Navigation bar (50px high) -->
      <div class="browser-top-bar">
        <div class="nav-buttons">
          <button id="nav-back" class="nav-btn" title="Go Back" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
          </button>
          <button id="nav-forward" class="nav-btn" title="Go Forward" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
          <button id="nav-reload" class="nav-btn" title="Reload Web Page">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
            </svg>
          </button>
        </div>

      </div>

      <!-- The BrowserView is loaded directly under this bar inside the remaining viewport -->
    </main>

    <!-- Toast alerts -->
    <div id="toast" class="toast-container">
      <span id="toast-icon">ℹ️</span>
      <span id="toast-message">Notification here</span>
    </div>

  </div>

  <!-- Scripts -->
  <script src="shared.js"></script>
  <script src="full.js"></script>
</body>
</html>
